name: Live ESI

# Runs the smoke test against the live ESI API (`tests/live.rs`, ignored in
# the normal test run): one public endpoint of every group, read into the
# type the crate returns. It finds a change in what ESI sends that the OpenAPI
# spec does not show (`spec-diff.yml` covers the spec itself). It runs weekly
# and can be run by hand.
#
# ESI is a public service: if it is down or throttling, the run fails for
# that reason. The test is tried twice before the job gives up.
on:
  schedule:
    - cron: "47 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  live:
    name: live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: live-esi
          cache-on-failure: true
      - name: Smoke test the public endpoints
        run: |
          for attempt in 1 2; do
            if cargo test --test live -- --ignored --nocapture; then
              exit 0
            fi
            echo "::warning::attempt $attempt failed"
            sleep 60
          done
          exit 1
