[package]
name = "esi-openapi"
version = "0.2.1"
authors = ["Rafael <rafaga@users.noreply.github.com>", "Celeo <mattboulanger@fastmail.com>"]
edition = "2021"
description = "Rust API for EVE Online's ESI, based on the OpenAPI specification (fork of rfesi)"
readme = "README.md"
repository = "https://github.com/rafaga/esi-openapi"
documentation = "https://docs.rs/esi-openapi"
license = "MIT OR Apache-2.0"
exclude = [".github"]
keywords = ["eve", "eve-online", "esi", "openapi"]
categories = ["api-bindings"]

[dependencies]
base64 = "0.23"
http = "1.5"
jsonwebtoken = { version = "11.1", optional = true, features = ["rust_crypto"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
log = "0.4"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "charset", "http2", "form", "query", "gzip", "brotli", "deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = "1.54"
uuid = { version = "1.29", features = ["serde"] }

[dev-dependencies]
dotenvy = "0.15"
pretty_env_logger = "0.5"
rusty-hook = "0.11"
tokio = { version = "1.54", features = ["full"] }
chrono = "0.4"
uuid = { version = "1.29", features = ["v4", "fast-rng"] }

[features]
default = ["random_state", "validate_jwt", "rustls-tls"]
random_state = []
validate_jwt = ["dep:jsonwebtoken"]
# default-tls = ["reqwest/default-tls"]
rustls-tls = ["reqwest/rustls"]
