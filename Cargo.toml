[package]
name = "esi-openapi"
version = "0.1.0"
authors = ["Rafael <rafaga@users.noreply.github.com>", "Celeo <mattboulanger@fastmail.com>"]
edition = "2021"
description = "Rust API for EVE Online's ESI, based on the OpenAPI specification (fork of rfesi)"
readme = "README.md"
repository = "https://github.com/rafaga/esi-openapi"
documentation = "https://docs.rs/esi-openapi"
license = "MIT OR Apache-2.0"
exclude = [".github"]
keywords = ["eve", "eve-online", "esi", "openapi"]
categories = ["api-bindings"]

[dependencies]
base64 = "0.23.1"
http = "1.3.1"
jsonwebtoken = { version = "11.1.0", optional = true, features = ["rust_crypto"] }
log = "0.4.27"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "charset", "http2", "form", "query"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = "1"

[dev-dependencies]
dotenvy = "0.15.7"
pretty_env_logger = "0.5.0"
rusty-hook = "0.11.2"
tokio = { version = "1.45.0", features = ["full"] }
chrono = "0.4.41"
uuid = { version = "1.16.0", features = ["v4", "fast-rng"] }

[features]
default = ["random_state", "validate_jwt", "rustls-tls"]
random_state = []
validate_jwt = ["dep:jsonwebtoken"]
# default-tls = ["reqwest/default-tls"]
rustls-tls = ["reqwest/rustls"]
